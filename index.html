<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A pixel-art dashboard built with the PixeliumDesign component library" />
    <title>Pixelium Dashboard</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('pixelium-theme')
          document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
